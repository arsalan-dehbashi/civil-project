services:

  civil-project:
    build: .
    container_name: civil-project
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  db:
    image: docker.arvancloud.ir/mariadb:latest
    container_name: civil-project-db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h localhost -u$${MARIADB_USER} -p$${MARIADB_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_net

  redis:
    image: docker.arvancloud.ir/redis:latest
    container_name: civil-project-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: docker.arvancloud.ir/phpmyadmin:latest
    container_name: civil-project-pma
    restart: unless-stopped
    ports:
      - "${PMA_HOST_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 500MB
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  mariadb_data:
