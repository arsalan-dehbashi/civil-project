root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/civil-project ./cmd/server"
bin = "./tmp/civil-project"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true